<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Card</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .card {
            background-color: white;
            width: 800px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
            display: flex;
        }
        
        .photo-placeholder {
            width: 150px;
            height: 150px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 20px;
            background-color: #f9f9f9;
            overflow: hidden;
        }
        
        .photo-placeholder img {
            max-width: 100%;
            max-height: 100%;
        }
        
        .info-section {
            flex: 1;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 28px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
        }
        
        .info-label {
            font-weight: bold;
            color: #7f8c8d;
            text-align: right;
        }
        
        .info-value {
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        
        .qr-placeholder {
            width: 100px;
            height: 100px;
            border: 1px solid #eee;
            margin-top: 20px;
            margin-left: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
            cursor: pointer;
        }
        
        .qr-placeholder img {
            max-width: 100%;
            max-height: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
        }
        
        .back-button:hover {
            background-color: #2980b9;
        }
        
        .back-button::before {
            content: "←";
            margin-right: 5px;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 80%;
            max-height: 80%;
        }
        
        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        
        .close-modal {
            margin-top: 15px;
            padding: 8px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .close-modal:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
        <button class="back-button" onclick="window.history.back()">Back</button>
        <div class="info-section">
            <div class="header">
                <h1>Student Information</h1>
                <div class="logo">ID CARD</div>
            </div>
            
            <div class="info-grid">
                <div class="info-label">Name:</div>
                <div class="info-value">{{ ojt[1] }}</div>
            
                <div class="info-label">Contact:</div>
                <div class="info-value">{{ ojt[2] }}</div>
            
                <div class="info-label">School:</div>
                <div class="info-value">{{ ojt[3] }}</div>
            
                <div class="info-label">Grade Level:</div>
                <div class="info-value">{{ ojt[4] }}</div>
            
                <div class="info-label">Course:</div>
                <div class="info-value">{{ ojt[5] }}</div>
            
                <div class="info-label">Region:</div>
                <div class="info-value">{{ ojt[6] }}</div>
            
                <div class="info-label">City:</div>
                <div class="info-value">{{ ojt[7] }}</div>
            
                <div class="info-label">Barangay:</div>
                <div class="info-value">{{ ojt[8] }}</div>
            
                <div class="info-label">Street:</div>
                <div class="info-value">{{ ojt[9] }}</div>
            
                <div class="info-label">OJT Hours:</div>
                <div class="info-value">{{ ojt[10] }}</div>
            </div>
            
            <div class="qr-placeholder" onclick="openModal()">
                <img src="{{ url_for('static', filename='qrcodes/'+ path) }}" alt="QR Code">
            </div>
        </div>
        
        <div class="photo-placeholder">
            [Photo]
        </div>
    </div>
    
    <!-- QR Code Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <img src="{{ url_for('static', filename='qrcodes/'+ path) }}" alt="QR Code">
            <button class="close-modal" onclick="closeModal()">Close</button>
        </div>
    </div>
    
    <script>
        function openModal() {
            document.getElementById('qrModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
        
        // Close modal when clicking outside the image
        window.onclick = function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
